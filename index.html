<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>閉じた家</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Shippori+Mincho:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0e0d0b;
        --paper: #1a1814;
        --text: #c8bfaa;
        --text-dim: #6b6355;
        --accent: #8a7a5a;
        --accent-bright: #c4a96a;
        --border: #2a2620;
        --choice-bg: #141210;
        --choice-hover: #1f1d18;
        --choice-border: #3a3428;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Noto Serif JP", "Shippori Mincho", serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* グレインオーバーレイ */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 100;
        opacity: 0.4;
      }

      #game {
        width: 100%;
        max-width: 640px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 0 24px;
        position: relative;
        overflow: hidden;
      }

      /* ヘッダー */
      #header {
        flex-shrink: 0;
        padding: 20px 0 12px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid var(--border);
        background: rgba(14, 13, 11, 0.6); /* ← 追加 */
      }

      #location-name {
        font-family: "Shippori Mincho", serif;
        font-size: 11px;
        letter-spacing: 0.3em;
        color: var(--text-dim);
        text-transform: uppercase;
        transition: opacity 0.8s;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.8); /* ← 追加 */
      }

      #step-count {
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--text-dim);
      }

      /* メインテキストエリア */
      #scene-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 20px 0 16px;
        overflow: hidden;
        min-height: 0;
        background: linear-gradient(
          to right,
          rgba(14, 13, 11, 0.75) 0%,
          rgba(14, 13, 11, 0.55) 70%,
          rgba(14, 13, 11, 0) 100%
        );
      }
      #scene-text {
        font-size: 15px;
        line-height: 2.2;
        letter-spacing: 0.06em;
        color: var(--text);
        opacity: 0;
        transition: opacity 0.9s ease;
        white-space: pre-wrap;
      }

      #scene-text.visible {
        opacity: 1;
      }

      /* 環境描写（サブテキスト） */
      #ambient-text {
        margin-top: 24px;
        font-size: 12px;
        line-height: 2;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        font-style: italic;
        opacity: 0;
        transition: opacity 0.3s ease; /* 遅延を削除、速度を短く */
      }
      #ambient-text.visible {
        opacity: 1;
      }

      /* 選択肢エリア */
      #choices-area {
        flex-shrink: 0;
        padding-bottom: 24px;
        opacity: 0;
        transition: opacity 0.3s ease;
        background: linear-gradient(
          to right,
          rgba(14, 13, 11, 0.75) 0%,
          rgba(14, 13, 11, 0.55) 70%,
          rgba(14, 13, 11, 0) 100%
        );
      }
      #choices-area.visible {
        opacity: 1;
      }

      #choices-label {
        font-size: 10px;
        letter-spacing: 0.4em;
        color: var(--text-dim);
        margin-bottom: 16px;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9); /* ← 追加 */
      }

      .choice-btn {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--choice-bg);
        border: 1px solid var(--choice-border);
        color: var(--text);
        font-family: "Noto Serif JP", serif;
        font-size: 12px;
        letter-spacing: 0.08em;
        line-height: 1.6;
        padding: 10px 20px;
        margin-bottom: 8px;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          color 0.2s;
        position: relative;
        overflow: hidden;
      }

      .choice-btn::before {
        content: "›";
        position: absolute;
        left: 8px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        font-size: 14px;
        transition:
          left 0.2s,
          color 0.2s;
      }

      .choice-btn:hover {
        background: var(--choice-hover);
        border-color: var(--accent);
        color: var(--accent-bright);
      }

      .choice-btn:hover::before {
        left: 12px;
        color: var(--accent-bright);
      }

      /* タイトル画面 */
      #title-screen {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
        transition: opacity 1.5s ease;
      }

      #title-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #title-main {
        font-family: "Shippori Mincho", serif;
        font-size: 36px;
        font-weight: 500;
        letter-spacing: 0.5em;
        color: var(--text);
        margin-bottom: 8px;
        opacity: 0;
        animation: fadeUp 1.5s ease 0.5s forwards;
      }

      #title-sub {
        font-size: 11px;
        letter-spacing: 0.5em;
        color: var(--text-dim);
        margin-bottom: 64px;
        opacity: 0;
        animation: fadeUp 1.5s ease 1s forwards;
      }

      #start-btn {
        background: none;
        border: 1px solid var(--accent);
        color: var(--accent-bright);
        font-family: "Noto Serif JP", serif;
        font-size: 12px;
        letter-spacing: 0.4em;
        padding: 14px 40px;
        cursor: pointer;
        transition:
          background 0.3s,
          color 0.3s;
        opacity: 0;
        animation: fadeUp 1.5s ease 1.6s forwards;
      }

      #start-btn:hover {
        background: var(--accent);
        color: var(--bg);
      }

      /* 区切り線 */
      .divider {
        width: 32px;
        height: 1px;
        background: var(--border);
        margin: 28px 0;
      }

      /* オープニング専用：AIウィンドウ */
      #ai-window {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease;
        overflow: hidden;
      }
      #ai-window.active {
        opacity: 1;
        pointer-events: all;
      }

      #ai-inner {
        width: 100%;
        max-width: 560px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px 24px;
        overflow: hidden;
      }

      #ai-label {
        font-size: 10px;
        letter-spacing: 0.4em;
        color: var(--text-dim);
        margin-bottom: 20px;
      }

      #ai-log {
        flex: 1;
        overflow: hidden;
        min-height: 0;
        position: relative;
      }

      #ai-log-inner {
        font-size: 13px;
        line-height: 2.2;
        letter-spacing: 0.05em;
        color: var(--text);
        white-space: pre-wrap;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        transition: transform 0.6s ease;
      }

      /* AIの警告メッセージ専用スタイル */
      .ai-warning {
        display: block;
        margin-top: 20px;
        margin-bottom: 20px; /* ← この1行を追加 */
        padding: 16px 20px;
        border: 1px solid #5a3a2a;
        background: #1a0e08;
        color: #c4714a;
        font-size: 12px;
        line-height: 2;
        letter-spacing: 0.06em;
        white-space: pre-line;
      }

      .ai-warning-label {
        font-size: 10px;
        letter-spacing: 0.4em;
        color: #8a4a2a;
        display: block;
        margin-bottom: 8px;
      }

      #ai-continue {
        display: block;
        margin-top: 32px;
        background: none;
        border: none;
        color: var(--text-dim);
        font-family: "Noto Serif JP", serif;
        font-size: 12px;
        letter-spacing: 0.3em;
        cursor: pointer;
        padding: 8px 0;
        opacity: 0;
        transition:
          opacity 0.6s ease,
          color 0.2s;
      }
      #ai-continue.visible {
        opacity: 1;
      }
      #ai-continue:hover {
        color: var(--text);
      }

      /* エンディング専用スタイル */
      #game.ending #location-name,
      #game.ending #step-count,
      #game.ending #choices-label {
        opacity: 0;
      }

      #game.ending #scene-text {
        font-size: 17px;
        line-height: 2.8;
        letter-spacing: 0.1em;
        text-align: center;
        color: var(--text);
      }

      #game.ending #choices-area {
        text-align: center;
      }

      #game.ending .choice-btn {
        display: inline-block;
        width: auto;
        background: rgba(14, 13, 11, 0.6); /* noneから変更 */
        border: 1px solid var(--border); /* noneから変更 */
        color: var(--text-dim);
        font-size: 11px;
        letter-spacing: 0.4em;
        padding: 8px 16px;
        text-shadow: none;
      }
      #game.ending .choice-btn::before {
        display: none;
      }
      #game.ending .choice-btn:hover {
        background: rgba(14, 13, 11, 0.8);
        border-color: var(--accent);
        color: var(--text);
        text-shadow: none;
      }

      /* 背景画像 */
      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0;
        transition: opacity 1.2s ease;
      }
      #bg.visible {
        opacity: 1;
      }
      #bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
      }
      #game {
        position: relative;
        z-index: 1;
      }
      /* フェードアニメーション */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 画面遷移オーバーレイ */
      #overlay {
        position: fixed;
        inset: 0;
        background: var(--bg);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
        z-index: 30;
      }
      #overlay.active {
        opacity: 1;
        pointer-events: all;
      }

      /* メモ帳（サイドバー的なもの） */
      #memo {
        position: fixed;
        bottom: 24px;
        right: 24px;
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--text-dim);
        text-align: right;
        line-height: 2;
        opacity: 0;
        transition: opacity 1s ease 1s;
      }
      #memo.visible {
        opacity: 1;
      }
      #lang-btn {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.3); /* ← transparentから変更 */
        border: 1px solid var(--text-dim);
        color: var(--text-dim);
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        padding: 4px 10px;
        cursor: pointer;
        transition:
          color 0.3s,
          border-color 0.3s;
      }
      #lang-btn:hover {
        color: var(--text);
        border-color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>

    <!-- タイトル画面 -->
    <div id="title-screen">
      <div id="title-main" id="title-main">閉じた家</div>
      <div id="title-sub" id="title-sub">a psychological exploration</div>
      <button id="start-btn" onclick="showOpening()">は じ め る</button>
    </div>

    <!-- AIウィンドウ（オープニング演出） -->
    <div id="ai-window">
      <div id="ai-inner">
        <div id="ai-label">— AI / SESSION LOG —</div>
        <div id="ai-log"><div id="ai-log-inner"></div></div>
        <button id="ai-continue" onclick="proceedFromOpening()">
          続ける ›
        </button>
      </div>
    </div>

    <!-- 画面遷移オーバーレイ -->
    <div id="overlay"></div>

    <!-- ゲーム本体 -->
    <div id="game">
      <div id="header">
        <div id="location-name">—</div>
        <div id="step-count"></div>
      </div>

      <div id="scene-area">
        <div id="scene-text"></div>
        <div id="ambient-text"></div>
      </div>

      <div id="choices-area">
        <div id="choices-label">— 行動を選ぶ —</div>
        <div id="choices-container"></div>
      </div>
    </div>

    <div id="memo"></div>
    <button id="lang-btn" onclick="toggleLang()">EN</button>

      function showOpening() {
        document.getElementById("title-screen").classList.add("hidden");
        setTimeout(() => {
          document.getElementById("ai-window").classList.add("active");
          playOpeningSequence();
        }, 1500);
      }

      function playOpeningSequence() {
        const logInner = document.getElementById("ai-log-inner");
        const logOuter = document.getElementById("ai-log");
        logInner.innerHTML = "";

        const lastDelay = openingSequence[openingSequence.length - 1].delay;

        function scrollToBottom() {
          // ai-log-innerの高さがai-logを超えた分だけ上にずらす演出
          const outerH = logOuter.offsetHeight;
          const innerH = logInner.offsetHeight;
          const overflow = innerH - outerH;
          if (overflow > 0) {
            logInner.style.transform = `translateY(-${overflow}px)`;
          }
        }

        openingSequence.forEach((item) => {
          setTimeout(() => {
            if (item.type === "warning") {
              const warn = document.createElement("span");
              warn.className = "ai-warning";
              const warningText =
                lang === "ja"
                  ? "この会話には、心理的に負荷のかかる内容が含まれます。\n続ける場合は、自分のペースで進めてください。"
                  : "This session contains content that may be psychologically distressing.\nProceed at your own pace.";
              warn.innerHTML = `<span class="ai-warning-label">⚠ SYSTEM NOTICE</span>${warningText}`;
              logInner.appendChild(warn);
            } else {
              const line = document.createElement("div");
              const prefix = item.type === "ai" ? "AI　　" : "Ryo　";
              if (item.type === "user") playSe("keyboard");
              const text =
                lang === "ja" ? item.text : item.text_en || item.text;
              const color =
                item.type === "ai" ? "var(--text-dim)" : "var(--text)";
              line.style.cssText = `color:${color}; margin-bottom:6px; opacity:0; transition:opacity 0.6s ease;`;
              line.textContent = `${prefix}${text}`;
              logInner.appendChild(line);
              requestAnimationFrame(() =>
                requestAnimationFrame(() => {
                  line.style.opacity = "1";
                  scrollToBottom();
                }),
              );
            }
            scrollToBottom();
          }, item.delay);
        });

        // 全アイテムが表示され終わった後に「続ける」ボタンを表示
        setTimeout(() => {
          const btn = document.getElementById("ai-continue");
          btn.classList.add("visible");
          btn.style.opacity = "1";
          scrollToBottom();
        }, lastDelay + 1200);
      }

      function proceedFromOpening() {
        const aiWindow = document.getElementById("ai-window");
        aiWindow.style.opacity = "0";
        setTimeout(() => {
          aiWindow.classList.remove("active");
          gameStarted = true;
          loadScene("road");
          document.getElementById("memo").classList.add("visible");
        }, 800);
      }

      function startGame() {
        document.getElementById("title-screen").classList.add("hidden");
        document.getElementById("bg").classList.remove("visible");
        document.getElementById("game").style.opacity = "1"; // ← 追加
        setTimeout(() => {
          gameStarted = true;
          loadScene("road");
          document.getElementById("memo").classList.add("visible");
        }, 1500);
      }
      function loadScene(sceneId, delay = 0) {
        const overlay = document.getElementById("overlay");

        overlay.classList.add("active");

        // テキストをリセット
        const sceneText = document.getElementById("scene-text");
        const ambientText = document.getElementById("ambient-text");
        const choicesArea = document.getElementById("choices-area");

        sceneText.classList.remove("visible");
        ambientText.classList.remove("visible");
        choicesArea.classList.remove("visible");

        setTimeout(() => {
          const scene = scenes[sceneId];
          currentScene = sceneId;

          // 背景画像切り替え
          const bgEl = document.getElementById("bg");
          if (scene.bg && BG[scene.bg]) {
            bgEl.style.backgroundImage = `url(${BG[scene.bg]})`;
            bgEl.classList.add("visible");
            // entranceだけ暗くする
            bgEl.style.filter = "brightness(1)";
          } else {
            bgEl.classList.remove("visible");
            bgEl.style.filter = "brightness(1)";
          }

          // ↓ この1行を追加
          const bgmFile = sceneBgmOverride[sceneId] || bgmMap[scene.bg];
          if (bgmFile) playBgm(bgmFile);

          // ロケーション更新
          document.getElementById("location-name").textContent = scene.location;

          // ステップカウント
          if (!scene.noCount) stepCount++;
          document.getElementById("step-count").textContent =
            `${stepCount} steps`;

          // オーバーレイを外す
          overlay.classList.remove("active");

          setTimeout(() => {
            // テキストをセット＆表示
            sceneText.textContent =
              lang === "ja" ? scene.text : scene.text_en || scene.text;
            sceneText.classList.add("visible");

            if (scene.ambient || scene.ambient_en) {
              ambientText.textContent =
                lang === "ja"
                  ? scene.ambient
                  : scene.ambient_en || scene.ambient;
              ambientText.classList.add("visible");
            } else {
              ambientText.textContent = "";
            }

            // ロケーション更新（loadScene内の既存の行を置き換え）
            document.getElementById("location-name").textContent =
              lang === "ja"
                ? scene.location
                : scene.location_en || scene.location;

            // 「行動を選ぶ」ラベル
            document.getElementById("choices-label").textContent =
              lang === "ja" ? "— 行動を選ぶ —" : "— Choose an action —";

            // 選択肢を生成
            const container = document.getElementById("choices-container");
            container.innerHTML = "";

            scene.choices.forEach((choice) => {
              const btn = document.createElement("button");
              btn.className = "choice-btn";
              btn.textContent =
                lang === "ja" ? choice.label : choice.label_en || choice.label;
              btn.onclick =
                choice.next === null
                  ? returnToTitle
                  : () => handleChoice(choice);
              container.appendChild(btn);
            });
            choicesArea.classList.add("visible");

            // エンディング判定
            if (scene.isEnding) {
              document.getElementById("game").classList.add("ending");
            } else {
              document.getElementById("game").classList.remove("ending");
            }
          }, 400);
        }, delay + 600);
      }

      function handleChoice(choice) {
        playSe("click");
        if (choice.reset) stepCount = 0;
        loadScene(choice.next);
      }

      function returnToTitle() {
        playSe("click");
        stepCount = 0;
        gameStarted = false;
        document.getElementById("game").classList.remove("ending");
        document.getElementById("game").style.opacity = "0"; // ← 追加
        document.getElementById("bg").classList.remove("visible");
        document.getElementById("scene-text").classList.remove("visible");
        document.getElementById("ambient-text").classList.remove("visible");
        document.getElementById("choices-area").classList.remove("visible");
        if (currentBgm) {
          currentBgm.pause();
          currentBgm.currentTime = 0;
          currentBgm = null;
        }
        document.getElementById("title-screen").classList.remove("hidden");
        document.getElementById("title-main").textContent =
          lang === "ja" ? "閉じた家" : "Closed Room";
        document.getElementById("start-btn").textContent =
          lang === "ja" ? "は じ め る" : "S T A R T";
        document.getElementById("start-btn").onclick = startGame;
      }
    </script>
  </body>
</html>
